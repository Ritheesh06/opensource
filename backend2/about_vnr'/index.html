<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About VNR</title>
</head>
<body>
    <h1 id="title">Loading...</h1>
    <div id="content">Please wait while we load the content.</div>

    <script>
        // Fetch content from the backend /about_vnr endpoint
        fetch('http://localhost:3000/about_vnr')
            .then(response => response.json()) // Parse the response as JSON
            .then(data => {
                // Insert the title and content into the page
                document.getElementById('title').textContent = data.title;
                document.getElementById('content').textContent = data.content;
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('content').textContent = 'Failed to load content';
            });
    </script>
</body>
</html>
